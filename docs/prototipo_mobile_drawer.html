<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumen — Módulo 4: Gaveta de Cristal Mobile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --fundo: #08090d;
      --fundo-elevado: #111319;
      --vidro-base: rgba(18, 20, 28, 0.85);
      --vidro-borda: rgba(230, 225, 216, 0.08);
      --vidro-luz: inset 0 1px 0 rgba(255, 225, 190, 0.14);
      --tinta: #e8e3da;
      --tinta-media: #9a9790;
      --tinta-fraca: #63615c;
      --cor-ativa: #e59a3c;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--fundo);
      color: var(--tinta);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    /* Moldura de Smartphone para Teste no Desktop */
    .aparelho-moldura {
      width: 390px;
      height: 780px;
      background: #000;
      border-radius: 46px;
      border: 4px solid #232530;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Iluminação ambiente do mobile */
    .luz-mobile {
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(229, 154, 60, 0.1) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
    }

    /* Topo do Smartphone */
    .mobile-topo {
      position: relative;
      z-index: 10;
      padding: 22px 24px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mobile-marca {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 700;
      color: var(--tinta);
    }

    .marca-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--cor-ativa);
      box-shadow: 0 0 10px var(--cor-ativa);
    }

    /* Área da Roda Cromática no Mobile */
    .mobile-palco {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 20px;
      position: relative;
      z-index: 2;
    }

    .mobile-disco {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: conic-gradient(from 90deg, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
      box-shadow: 0 16px 30px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.18);
      position: relative;
      margin-bottom: 20px;
    }

    .mobile-hex {
      font-family: 'JetBrains Mono', monospace;
      font-size: 34px;
      font-weight: 500;
      color: var(--tinta);
      border-bottom: 2px solid var(--cor-ativa);
      padding-bottom: 2px;
    }

    /* Gaveta de Cristal (Bottom Sheet) */
    .bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--vidro-base);
      backdrop-filter: blur(34px);
      border-top: 1px solid var(--vidro-borda);
      border-radius: 28px 28px 0 0;
      box-shadow: var(--vidro-luz), 0 -16px 40px rgba(0, 0, 0, 0.85);
      z-index: 30;
      display: flex;
      flex-direction: column;
      transition: height 400ms var(--ease);
      height: 120px; /* Estado 1 (Recolhida) */
    }

    .bottom-sheet.meia-altura {
      height: 380px; /* Estado 2 (Meia Altura) */
    }

    .bottom-sheet.expandida {
      height: 680px; /* Estado 3 (Tela Cheia) */
    }

    /* Alça de puxar (Drag Handle) */
    .sheet-alca-area {
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: grab;
    }

    .sheet-alca {
      width: 38px;
      height: 4.5px;
      border-radius: 999px;
      background: rgba(230, 225, 216, 0.25);
    }

    .sheet-status-linha {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0 16px;
    }

    .sheet-botoes-estado {
      display: flex;
      gap: 8px;
    }

    .btn-estagio {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(230, 225, 216, 0.08);
      border: 1px solid var(--vidro-borda);
      color: var(--tinta-media);
      cursor: pointer;
    }

    .btn-estagio.ativo {
      color: var(--tinta);
      background: rgba(229, 154, 60, 0.2);
      border-color: rgba(229, 154, 60, 0.4);
    }

    /* Conteúdo da Gaveta com Swipe Horizontal */
    .sheet-conteudo {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 30px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .mini-cartao-mobile {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(230, 225, 216, 0.06);
      border-radius: 16px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Pulso Háptico Simulado */
    .haptic-flash {
      position: absolute;
      inset: 0;
      background: rgba(229, 154, 60, 0.12);
      pointer-events: none;
      opacity: 0;
      transition: opacity 200ms ease;
      z-index: 100;
    }

    .haptic-flash.pulso {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="aparelho-moldura">
    <div class="luz-mobile"></div>
    <div class="haptic-flash" id="hapticFlash"></div>

    <header class="mobile-topo">
      <div class="mobile-marca">
        <div class="marca-dot"></div>
        Lumen Mobile
      </div>
      <span style="font-family:'JetBrains Mono'; font-size:11px; color:var(--tinta-fraca)">Ateliê Móvel</span>
    </header>

    <div class="mobile-palco">
      <div class="mobile-disco"></div>
      <div class="mobile-hex">#E59A3C</div>
      <p style="font-size:12px; color:var(--tinta-fraca); margin-top:8px">Matiz 33° · Sat 74%</p>
    </div>

    <!-- Gaveta de Cristal (Bottom Sheet de 3 Estágios) -->
    <div class="bottom-sheet meia-altura" id="bottomSheet">
      <div class="sheet-alca-area" id="sheetAlca">
        <div class="sheet-alca"></div>
      </div>

      <div class="sheet-status-linha">
        <span style="font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--tinta-media)" id="txtEstagio">
          Meia-Altura (50%)
        </span>
        <div class="sheet-botoes-estado">
          <button type="button" class="btn-estagio" onclick="mudarEstagio('recolhida')">Recolher</button>
          <button type="button" class="btn-estagio ativo" onclick="mudarEstagio('meia')">Meia</button>
          <button type="button" class="btn-estagio" onclick="mudarEstagio('cheia')">Cheia</button>
        </div>
      </div>

      <div class="sheet-conteudo">
        <div class="mini-cartao-mobile">
          <div style="display:flex; justify-content:space-between; font-size:12px; font-weight:600; text-transform:uppercase; color:var(--tinta-media)">
            <span>Contraste WCAG</span>
            <span style="color:#38b278; font-family:'JetBrains Mono'">Passa AA (5.4:1)</span>
          </div>
          <div style="height:6px; border-radius:999px; background:linear-gradient(90deg, #d33a3a 30%, #38b278 70%);"></div>
        </div>

        <div class="mini-cartao-mobile">
          <div style="font-size:12px; font-weight:600; text-transform:uppercase; color:var(--tinta-media)">
            Harmonias Imediatas
          </div>
          <div style="display:flex; gap:8px;">
            <div style="flex:1; height:32px; border-radius:8px; background:#e59a3c"></div>
            <div style="flex:1; height:32px; border-radius:8px; background:#3c87e5"></div>
            <div style="flex:1; height:32px; border-radius:8px; background:#e53c7b"></div>
            <div style="flex:1; height:32px; border-radius:8px; background:#3ce5a6"></div>
          </div>
        </div>

        <div class="mini-cartao-mobile">
          <div style="font-size:12px; font-weight:600; text-transform:uppercase; color:var(--tinta-media)">
            Foto de Referência
          </div>
          <div style="border:1px dashed rgba(230,225,216,0.15); border-radius:10px; padding:18px; text-align:center; font-size:12px; color:var(--tinta-fraca)">
            Toque para abrir a câmera ou galeria
          </div>
        </div>
      </div>
    </div>

  </div>

  <div style="margin-top:20px; font-size:13px; color:var(--tinta-fraca); text-align:center">
    💡 Clique nos botões <strong>Recolher / Meia / Cheia</strong> para testar os 3 estágios da Gaveta de Cristal.
  </div>

  <script>
    const bottomSheet = document.getElementById('bottomSheet');
    const txtEstagio = document.getElementById('txtEstagio');
    const hapticFlash = document.getElementById('hapticFlash');

    function dispararHaptic() {
      hapticFlash.classList.add('pulso');
      setTimeout(() => hapticFlash.classList.remove('pulso'), 200);
      if (navigator.vibrate) navigator.vibrate(15);
    }

    function mudarEstagio(estagio) {
      dispararHaptic();
      bottomSheet.classList.remove('meia-altura', 'expandida');
      document.querySelectorAll('.btn-estagio').forEach(b => b.classList.remove('ativo'));

      if (estagio === 'recolhida') {
        txtEstagio.textContent = 'Recolhida (Roda Livre)';
        event.target.classList.add('ativo');
      } else if (estagio === 'meia') {
        bottomSheet.classList.add('meia-altura');
        txtEstagio.textContent = 'Meia-Altura (50%)';
        event.target.classList.add('ativo');
      } else if (estagio === 'cheia') {
        bottomSheet.classList.add('expandida');
        txtEstagio.textContent = 'Tela Cheia (Imersão)';
        event.target.classList.add('ativo');
      }
    }
  </script>
</body>
</html>
