<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#060919"/>
      <stop offset="40%" stop-color="#0E1338"/>
      <stop offset="75%" stop-color="#1E1C4E"/>
      <stop offset="100%" stop-color="#3E2766"/>
    </linearGradient>

    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8D6FF">
        <animate attributeName="stop-color" values="#A8D6FF;#c084fc;#FFC46B;#A8D6FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#c084fc">
        <animate attributeName="stop-color" values="#c084fc;#FFC46B;#A8D6FF;#c084fc" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFC46B">
        <animate attributeName="stop-color" values="#FFC46B;#A8D6FF;#c084fc;#FFC46B" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="sub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F88B8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7F88B8" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#7F88B8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#7F88B8" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bokeh" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <radialGradient id="horizon" cx="50%" cy="95%" r="50%" fx="50%" fy="95%">
      <stop offset="0%" stop-color="#D5694E" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#3E2766" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#060919" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F88B8" stop-opacity="0"/>
      <stop offset="30%" stop-color="#7F88B8" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#7F88B8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7F88B8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#sky)" rx="16"/>
  <rect width="900" height="320" fill="url(#horizon)" rx="16"/>

  <!-- Stars -->
  <circle cx="95" cy="38" r="1" fill="#EDEFFB" opacity="0.35">
    <animate attributeName="opacity" values="0.15;0.45;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="210" cy="65" r="0.7" fill="#EDEFFB" opacity="0.25"/>
  <circle cx="310" cy="28" r="0.9" fill="#EDEFFB" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="445" cy="18" r="0.6" fill="#EDEFFB" opacity="0.2"/>
  <circle cx="560" cy="48" r="1.1" fill="#EDEFFB" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="680" cy="32" r="0.8" fill="#EDEFFB" opacity="0.25">
    <animate attributeName="opacity" values="0.12;0.35;0.12" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="770" cy="58" r="0.6" fill="#EDEFFB" opacity="0.2"/>
  <circle cx="840" cy="25" r="0.9" fill="#EDEFFB" opacity="0.28"/>
  <circle cx="155" cy="82" r="0.5" fill="#EDEFFB" opacity="0.18"/>
  <circle cx="630" cy="72" r="0.7" fill="#EDEFFB" opacity="0.22"/>

  <!-- City bokeh — warm -->
  <circle cx="65" cy="268" r="5" fill="#FFC46B" filter="url(#bokeh)" opacity="0.4">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="140" cy="282" r="3.5" fill="#FF9748" filter="url(#bokeh)" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.45;0.2" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="235" cy="272" r="4" fill="#FFC46B" filter="url(#bokeh)" opacity="0.4">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="320" cy="288" r="3" fill="#FFB565" filter="url(#bokeh)" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="415" cy="275" r="4.5" fill="#FFC46B" filter="url(#bokeh)" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.45;0.2" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="505" cy="285" r="3" fill="#FF9748" filter="url(#bokeh)" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="270" r="5" fill="#FFC46B" filter="url(#bokeh)" opacity="0.4">
    <animate attributeName="opacity" values="0.25;0.5;0.25" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="670" cy="280" r="3.5" fill="#FFB565" filter="url(#bokeh)" opacity="0.35">
    <animate attributeName="opacity" values="0.2;0.45;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="755" cy="268" r="4" fill="#FFC46B" filter="url(#bokeh)" opacity="0.38">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="278" r="3" fill="#FF9748" filter="url(#bokeh)" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- City bokeh — cool -->
  <circle cx="185" cy="265" r="2.5" fill="#A8D6FF" filter="url(#bokeh)" opacity="0.3">
    <animate attributeName="opacity" values="0.15;0.4;0.15" dur="5.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="290" r="2" fill="#A8D6FF" filter="url(#bokeh)" opacity="0.25">
    <animate attributeName="opacity" values="0.12;0.35;0.12" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="290" r="2.5" fill="#A8D6FF" filter="url(#bokeh)" opacity="0.28">
    <animate attributeName="opacity" values="0.15;0.38;0.15" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- City bokeh — pink -->
  <circle cx="280" cy="280" r="2" fill="#FF88B2" filter="url(#bokeh)" opacity="0.22">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="5.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="620" cy="292" r="2.5" fill="#FF88B2" filter="url(#bokeh)" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.28;0.1" dur="4.8s" repeatCount="indefinite"/>
  </circle>

  <!-- City bokeh — green -->
  <circle cx="370" cy="275" r="2" fill="#9CE9CB" filter="url(#bokeh)" opacity="0.2">
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Separator line -->
  <rect x="0" y="240" width="900" height="0.5" fill="url(#line)"/>

  <!-- Main text -->
  <text x="450" y="148" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif"
    font-weight="100" font-size="82" letter-spacing="36"
    fill="url(#tg)" filter="url(#glow)">
    LUMEN
  </text>

  <!-- Subtitle -->
  <text x="450" y="192" text-anchor="middle"
    font-family="'Segoe UI', 'SF Pro Display', 'Helvetica Neue', system-ui, sans-serif"
    font-weight="300" font-size="12" letter-spacing="7"
    fill="url(#sub)">
    FERRAMENTA DE COR PARA A WEB
  </text>
</svg>

